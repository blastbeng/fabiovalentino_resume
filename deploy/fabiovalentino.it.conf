## fabiovalentino.it — sito vetrina statico (root: /config/www/fabiovalentino.it)
## Il vecchio default.conf resta come fallback per gli host sconosciuti:
## il server_name fabiovalentino.it è stato rimosso da lì.

# HTTP: solo redirect + challenge ACME
server {
    listen 80;
    listen [::]:80;
    server_name fabiovalentino.it www.fabiovalentino.it;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /config/www;
    }

    location / {
        return 301 https://fabiovalentino.it$request_uri;
    }
}

# www -> apex (canonical)
server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    server_name www.fabiovalentino.it;

    include /config/nginx/ssl.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://fabiovalentino.it$request_uri;
}

# sito
server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;

    server_name fabiovalentino.it;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    include /config/nginx/ssl.conf;

    root /config/www/fabiovalentino.it;
    index index.html;

    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # asset statici: cache lunga
    location ~* \.(?:css|js|svg|png|jpe?g|webp|avif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
